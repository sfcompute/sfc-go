components:
  schemas:
    AllocationSchedule:
      type: "object"
      required:
        - "total"
        - "by_zone"
      properties:
        total:
          $ref: "#/components/schemas/Schedule"
          description: "Combined allocation schedule across all zones. Only includes current and future schedule."
        by_zone:
          type: "object"
          description: "Allocation schedule on a zone-by-zone basis. Only includes current and future schedule."
          additionalProperties:
            $ref: "#/components/schemas/Schedule"
          propertyNames:
            type: "string"
            example: "richmond"
    AutomationStatus:
      type: "string"
      enum:
        - "info"
        - "warning"
        - "error"
    BadRequestError:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "object"
          required:
            - "type"
            - "message"
          properties:
            type:
              type: "string"
              const: "invalid_request_error"
              default: "invalid_request_error"
              readOnly: true
            message:
              type: "string"
              x-speakeasy-error-message: true
            details:
              type: "array"
              items:
                $ref: "#/components/schemas/ErrorDetail"
    CapacitiesCursor:
      type: "string"
      examples:
        - "capc_gqXR7s0Kj5mHvE2wNpLc4Q"
      pattern: "^capc_[A-Za-z0-9_-]+$"
    CapacityExpand:
      type: "string"
      enum:
        - "procurements"
        - "deployments"
    CapacityId:
      type: "string"
      examples:
        - "cap_k3R-nX9vLm7Qp2Yw5Jd8F"
      pattern: "cap_[0-9a-zA-Z_-]{1,21}"
    CapacityKind:
      type: "string"
      description: "Capacity kind determines what operations are allowed on a capacity.\n- `Market`: User-created capacities. Fully manageable. - `Originating`: Provider capacities for selling compute. Cannot receive buy orders or be deleted. - `ReadOnly`: System-managed capacities. Cannot be modified through the API."
      enum:
        - "market"
        - "originating"
        - "read_only"
    CapacityResponse:
      type: "object"
      required:
        - "object"
        - "id"
        - "name"
        - "owner"
        - "workspace"
        - "resource_path"
        - "kind"
        - "zones"
        - "allocation_schedule"
        - "created_at"
      properties:
        object:
          type: "string"
          const: "capacity"
          default: "capacity"
          readOnly: true
        id:
          $ref: "#/components/schemas/CapacityId"
        name:
          $ref: "#/components/schemas/Name"
        owner:
          type: "string"
        workspace:
          type: "string"
        resource_path:
          type: "string"
        kind:
          $ref: "#/components/schemas/CapacityKind"
        zones:
          type: "array"
          items:
            $ref: "#/components/schemas/ZoneName"
          description: "Datacenter locations orders into this capacity can acquire compute from."
          minItems: 1
        allocation_schedule:
          $ref: "#/components/schemas/AllocationSchedule"
          description: "Allocation schedule of this capacity. Add to the schedule by placing buy orders into this capacity."
        procurements:
          $ref: "#/components/schemas/ExpandableList_ProcurementId_ProcurementSummary"
          description: "Active procurements targeting this capacity. Returns IDs by default, or summaries when `expand=procurements` is set."
        deployments:
          $ref: "#/components/schemas/ExpandableList_DeploymentId_DeploymentSummary"
          description: "Active deployments targeting this capacity. Returns IDs by default, or summaries when `expand=deployments` is set."
        created_at:
          $ref: "#/components/schemas/UnixEpoch"
        tags:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Tags"
              description: "Metadata tags attached to this capacity."
    CapacitySummary:
      type: "object"
      required:
        - "id"
        - "name"
      properties:
        id:
          $ref: "#/components/schemas/CapacityId"
        name:
          $ref: "#/components/schemas/Name"
    CompleteUploadRequest:
      type: "object"
      description: "Complete a multipart image upload."
      required:
        - "sha256"
      properties:
        sha256:
          type: "string"
          description: "Not verified on upload; used during node boot to verify integrity."
          maxLength: 64
          minLength: 64
          pattern: "^[a-f0-9]{64}$"
    ConflictError:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "object"
          required:
            - "type"
            - "message"
          properties:
            type:
              type: "string"
              const: "conflict"
              default: "conflict"
              readOnly: true
            message:
              type: "string"
              x-speakeasy-error-message: true
            details:
              type: "array"
              items:
                $ref: "#/components/schemas/ErrorDetail"
    CreateCapacityRequest:
      type: "object"
      required:
        - "workspace"
        - "zones"
      properties:
        name:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Name"
              description: "Unique name for this capacity."
        workspace:
          $ref: "#/components/schemas/ResourcePathOrId_WorkspaceId"
          description: "Workspace to create this capacity in."
        zones:
          type: "array"
          items:
            $ref: "#/components/schemas/ZoneName"
          description: "Datacenter locations orders into this capacity can acquire compute from."
          example:
            - "richmond"
          minItems: 1
        tags:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Tags"
              description: "Optional metadata tags for this capacity."
    CreateDeploymentRequest:
      type: "object"
      required:
        - "capacity"
        - "node_template"
        - "target_node_count"
      properties:
        name:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Name"
        capacity:
          $ref: "#/components/schemas/ResourcePathOrId_CapacityId"
        node_template:
          $ref: "#/components/schemas/ResourcePathOrId_NodeTemplateId"
        target_node_count:
          type: "integer"
          format: "int32"
        node_name_template:
          $ref: "#/components/schemas/NameTemplate"
    CreateFeatureFlagRequest:
      type: "object"
      required:
        - "feature_flag"
        - "account_regex"
        - "enabled"
      properties:
        feature_flag:
          type: "string"
        account_regex:
          type: "string"
        enabled:
          type: "boolean"
    CreateFeatureFlagResponse:
      type: "object"
      required:
        - "object"
        - "feature_flag_id"
        - "feature_flag"
        - "account_regex"
        - "enabled"
      properties:
        object:
          type: "string"
          const: "feature_flag"
          default: "feature_flag"
          readOnly: true
        feature_flag_id:
          type: "string"
        feature_flag:
          type: "string"
        account_regex:
          type: "string"
        enabled:
          type: "boolean"
    CreateNodeRequest:
      type: "object"
      required:
        - "capacity"
        - "image"
      properties:
        name:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Name"
        capacity:
          $ref: "#/components/schemas/ResourcePathOrId_CapacityId"
        image:
          $ref: "#/components/schemas/ResourcePathOrId_ImageId"
        cloud_init_user_data:
          type: "string"
          format: "byte"
          description: "Base64-encoded [cloud-init user data](https://cloudinit.readthedocs.io/en/latest/explanation/format/index.html). Maximum 64KB. Currently only the [User-Data Script](https://cloudinit.readthedocs.io/en/latest/explanation/format/user-data-script.html#user-data-script) format is supported."
          example: "IyEvYmluL2Jhc2gKZWNobyBoZWxsbyB3b3JsZAo="
          contentEncoding: "base64"
        tags:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Tags"
              description: "Optional metadata tags for this node."
    CreateNodeTemplateRequest:
      type: "object"
      required:
        - "workspace"
        - "image"
      properties:
        name:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Name"
        workspace:
          $ref: "#/components/schemas/ResourcePathOrId_WorkspaceId"
          description: "Workspace to create this template in."
        image:
          $ref: "#/components/schemas/ResourcePathOrId_ImageId"
          description: "Machine image to use when starting nodes with this template. Accepts name or ID."
        cloud_init_user_data:
          type: "string"
          format: "byte"
          description: "Base64-encoded [cloud-init user data](https://cloudinit.readthedocs.io/en/latest/explanation/format/index.html). Maximum 64KB. Currently only the [User-Data Script](https://cloudinit.readthedocs.io/en/latest/explanation/format/user-data-script.html#user-data-script) format is supported."
          example: "IyEvYmluL2Jhc2gKZWNobyBoZWxsbyB3b3JsZAo="
          contentEncoding: "base64"
    CreateProcurementRequest:
      type: "object"
      required:
        - "target"
        - "capacity"
        - "min_sell_price_dollars_per_node_hour"
        - "max_buy_price_dollars_per_node_hour"
        - "managed_window_minutes"
      properties:
        name:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Name"
        target:
          $ref: "#/components/schemas/ProcurementTarget"
        capacity:
          type: "string"
        min_sell_price_dollars_per_node_hour:
          $ref: "#/components/schemas/DollarsPerNodeHour"
          description: "Minimum price to sell compute for ($/node-hour). Must contain decimal point. Will be rounded to nearest multiple of $0.000060."
        max_buy_price_dollars_per_node_hour:
          $ref: "#/components/schemas/DollarsPerNodeHour"
          description: "Maximum price to buy compute ($/node-hour). Must contain decimal point. Will be rounded to nearest multiple of $0.000060."
        managed_window_minutes:
          type: "integer"
          format: "int32"
          description: "How far ahead (in minutes) the procurement buys and sells compute. Higher values secure compute further in advance but commit to longer windows that may need to be sold when scaling down, potentially at a loss. Lower values reduce waste but risk compute being unavailable. Orders are placed in 1-hour blocks, so the furthest hour is secured up to `managed_window_minutes - 60` minutes before it begins."
          maximum: 1440
          minimum: 60
        enabled:
          type: "boolean"
          description: "Enable/disable the procurement."
          default: true
    CreateTokenRequest:
      type: "object"
      required:
