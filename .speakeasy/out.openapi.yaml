        - "id"
        - "capacity"
        - "side"
        - "allow_standing"
        - "zones"
        - "delta"
        - "limit_price_dollars_per_node_hour"
        - "status"
        - "created_at"
      properties:
        object:
          type: "string"
          const: "order"
          default: "order"
          readOnly: true
        id:
          $ref: "#/components/schemas/OrderId"
        capacity:
          $ref: "#/components/schemas/Expandable_CapacityId_CapacitySummary"
          description: "Target capacity that receives or loses compute if this order fills (depending on order type)."
        side:
          $ref: "#/components/schemas/Side"
        allow_standing:
          type: "boolean"
          description: "If true, the order stays in the order book until either fills, is explicitly cancelled, or the order end time is reached resulting in automatic cancellation. If false, the order is cancelled immediately if it doesn't fill."
        zones:
          type: "array"
          items:
            $ref: "#/components/schemas/ZoneName"
          description: "Datacenter locations this order can fill in (derived from target capacity at order creation by default)."
          minItems: 1
        delta:
          oneOf:
            - type: "object"
              required:
                - "node_count"
                - "start_at"
                - "end_at"
                - "type"
              properties:
                node_count:
                  type: "integer"
                  format: "int32"
                  description: "Number of nodes to buy or sell."
                  minimum: 1
                start_at:
                  $ref: "#/components/schemas/UnixEpoch"
                  description: "Compute period start. Must be now or on a future hour boundary."
                end_at:
                  $ref: "#/components/schemas/UnixEpoch"
                  description: "Compute period end. Must be on an hour boundary."
                type:
                  type: "string"
                  const: "rectangle"
                  default: "rectangle"
                  readOnly: true
          description: "The desired change in capacity. Will be added if side is `buy`, subtracted if `side` is sell if the order fills."
        limit_price_dollars_per_node_hour:
          $ref: "#/components/schemas/DollarsPerNodeHour"
        status:
          $ref: "#/components/schemas/OrderStatus"
        created_at:
          $ref: "#/components/schemas/UnixEpoch"
        filled_at:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/UnixEpoch"
        filled_price_dollars_per_node_hour:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DollarsPerNodeHour"
        cancelled_at:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/UnixEpoch"
    v2.OrderSortBy:
      type: "string"
      enum:
        - "created_at"
        - "-created_at"
        - "start_at"
        - "-start_at"
  securitySchemes:
    bearer_auth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "Create an API token using `sf tokens create` or at https://sfcompute.com/account/api-keys."
security:
  - bearer_auth: []
tags:
  - name: "Capacities"
    description: "A bucket of owned compute balance over time."
  - name: "Orders"
    description: "Place orders targeting a capacity to increase your reserved compute balance during some time period."
  - name: "Node Templates"
    description: "Reusable node configuration."
  - name: "Images"
    description: "Custom machine images for nodes."
  - name: "Roles"
    description: "TOML-based permission role definitions."
  - name: "Grants"
    description: "Bind principals (users or tokens) to roles on a workspace."
  - name: "Tokens"
    description: "Workspace-scoped API tokens."
  - name: "Nodes"
    description: "Spin up nodes in a capacity to use your available compute."
  - name: "Procurements"
    description: "Market automations that maintain capacity by placing buy/sell orders."
  - name: "Deployments"
    description: "Deployment automations that maintain a fleet of nodes on a capacity."
  - name: "Workspaces"
    description: "Resource containers scoped to an account."
x-speakeasy-name-override:
  - operationId: "^list_"
    methodNameOverride: "list"
  - operationId: "^create_"
    methodNameOverride: "create"
