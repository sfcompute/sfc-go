openapi: "3.1.0"
info:
  title: "sfc-api"
  description: ""
  version: "0.1.0"
servers:
  - url: "https://api.sfcompute.com"
paths:
  /v2/capacities:
    get:
      tags:
        - "Capacities"
      summary: "List capacities"
      description: "List all capacities."
      operationId: "list_capacities"
      parameters:
        - name: "workspace"
          in: "query"
          description: "Filter by workspace."
          required: true
          schema:
            $ref: "#/components/schemas/ResourcePathOrId_WorkspaceId"
        - name: "id"
          in: "query"
          description: "Filter by capacity ID, resource path, or name (repeatable)."
          required: false
          schema:
            type: "array"
            items:
              $ref: "#/components/schemas/ResourcePathOrId_CapacityId"
          style: "form"
          explode: true
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "u-int32"
            default: 50
            maximum: 200
            minimum: 1
        - name: "starting_after"
          in: "query"
          description: "Set to the response's `cursor` to fetch the next page."
          required: false
          schema:
            $ref: "#/components/schemas/CapacitiesCursor"
        - name: "ending_before"
          in: "query"
          description: "Set to the response's `cursor` to fetch the previous page."
          required: false
          schema:
            $ref: "#/components/schemas/CapacitiesCursor"
        - name: "schedule_history_minutes"
          in: "query"
          description: "How many minutes of past schedule to include."
          required: false
          schema:
            type: "integer"
            format: "u-int64"
            default: 0
            maximum: 1440
            minimum: 0
        - name: "tag"
          in: "query"
          description: "Filter by tag key-value pair (repeatable). Format: `key=value` (the `=` between key and value must be percent-encoded in the URL)."
          required: false
          schema:
            type: "array"
            items:
              type: "string"
          style: "form"
          explode: true
        - name: "tag_key"
          in: "query"
          description: "Filter by tag key existence (repeatable). Returns resources that have a tag with this key, regardless of the value."
          required: false
          schema:
            type: "array"
            items:
              type: "string"
          style: "form"
          explode: true
        - name: "expand"
          in: "query"
          description: "Expand related resources inline instead of returning IDs."
          required: false
          schema:
            type: "array"
            items:
              type: "string"
              enum:
                - "procurements"
                - "deployments"
          style: "form"
          explode: true
      responses:
        "200":
          description: "Paginated list of capacities."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListCapacitiesResponse"
        "401":
          description: "Unauthorized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "422":
          description: "Validation failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
        "500":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
      x-speakeasy-pagination:
        type: "cursor"
        inputs:
          - name: "starting_after"
            in: "parameters"
            type: "cursor"
        outputs:
          nextCursor: "$.cursor"
    post:
      tags:
        - "Capacities"
      summary: "Create capacity"
      description: "Create a capacity to hold compute in specified zones."
      operationId: "create_capacity"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCapacityRequest"
        required: true
      responses:
        "201":
          description: "Capacity created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityResponse"
        "401":
          description: "Unauthorized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "403":
          description: "Forbidden."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "422":
          description: "Validation failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
        "500":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /v2/capacities/{id}:
    get:
      tags:
        - "Capacities"
      summary: "Get capacity"
      description: "Retrieve a capacity by ID, resource path, or name, including its compute schedule."
      operationId: "fetch_capacity"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            description: "A resource path like 'sfc:capacity:acme:prod:my-pool' _or_ an ID. Resource paths are human-readable but not stable - they change when resources are renamed or moved. IDs are stable and permanent."
            examples:
              - "cap_k3R-nX9vLm7Qp2Yw5Jd8F"
            pattern: "(cap_[0-9a-zA-Z_-]{1,21})|(sfc:capacity:[a-zA-Z0-9._-]+(:[a-zA-Z0-9._-]+){1,2})"
        - name: "schedule_history_minutes"
          in: "query"
          description: "How many minutes of past schedule to include."
          required: false
          schema:
            type: "integer"
            format: "u-int64"
            default: 0
            maximum: 1440
            minimum: 0
        - name: "expand"
          in: "query"
          description: "Expand related resources inline instead of returning IDs."
          required: false
          schema:
            type: "array"
            items:
              type: "string"
              enum:
                - "procurements"
                - "deployments"
          style: "form"
          explode: true
      responses:
        "200":
          description: "Capacity details."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityResponse"
        "401":
          description: "Unauthorized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "404":
          description: "Capacity not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "500":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
    delete:
      tags:
        - "Capacities"
      summary: "Delete capacity"
      description: "Delete a capacity. The capacity must have no active orders, future allocations, active nodes, deployments, or procurements. Remove all dependencies before deleting."
      operationId: "delete_capacity"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            description: "A resource path like 'sfc:capacity:acme:prod:my-pool' _or_ an ID. Resource paths are human-readable but not stable - they change when resources are renamed or moved. IDs are stable and permanent."
            examples:
              - "cap_k3R-nX9vLm7Qp2Yw5Jd8F"
            pattern: "(cap_[0-9a-zA-Z_-]{1,21})|(sfc:capacity:[a-zA-Z0-9._-]+(:[a-zA-Z0-9._-]+){1,2})"
      responses:
        "204":
          description: "Capacity deleted."
        "401":
          description: "Unauthorized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "404":
          description: "Capacity not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "422":
          description: "Capacity has active dependencies."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
        "500":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
    patch:
      tags:
        - "Capacities"
      summary: "Update capacity"
      description: "Update a capacity. Omitted fields are left unchanged."
      operationId: "update_capacity"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            description: "A resource path like 'sfc:capacity:acme:prod:my-pool' _or_ an ID. Resource paths are human-readable but not stable - they change when resources are renamed or moved. IDs are stable and permanent."
            examples:
              - "cap_k3R-nX9vLm7Qp2Yw5Jd8F"
            pattern: "(cap_[0-9a-zA-Z_-]{1,21})|(sfc:capacity:[a-zA-Z0-9._-]+(:[a-zA-Z0-9._-]+){1,2})"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCapacityRequest"
        required: true
      responses:
        "200":
          description: "Capacity updated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapacityResponse"
        "401":
          description: "Unauthorized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "403":
          description: "Forbidden."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: "Capacity not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "422":
          description: "Validation failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
        "500":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /v2/deployments:
    get:
      tags:
        - "Deployments"
      summary: "List deployments"
      description: "List all deployments."
      operationId: "list_deployments"
      parameters:
        - name: "workspace"
          in: "query"
          description: "Filter by workspace."
          required: true
          schema:
            $ref: "#/components/schemas/ResourcePathOrId_WorkspaceId"
        - name: "capacity"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/ResourcePathOrId_CapacityId"
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "u-int32"
            default: 50
            maximum: 50
            minimum: 1
        - name: "starting_after"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/DeploymentsCursor"
        - name: "ending_before"
          in: "query"
          required: false
          schema:
            $ref: "#/components/schemas/DeploymentsCursor"
        - name: "expand"
          in: "query"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
              enum:
                - "capacity"
                - "node_template"
          style: "form"
          explode: true
      responses:
        "200":
          description: "Paginated list of deployments."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDeploymentsResponse"
        "401":
          description: "Unauthorized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "422":
          description: "Validation failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
        "500":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
      x-speakeasy-pagination:
        type: "cursor"
        inputs:
          - name: "starting_after"
            in: "parameters"
            type: "cursor"
        outputs:
          nextCursor: "$.cursor"
    post:
      tags:
        - "Deployments"
      summary: "Create deployment"
      description: "Create a deployment for bulk node management."
      operationId: "create_deployment"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeploymentRequest"
        required: true
      responses:
        "201":
          description: "Deployment created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentResponse"
        "400":
          description: "Deployment with this name already exists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        "401":
          description: "Unauthorized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "403":
          description: "Forbidden."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: "Capacity or node template not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "422":
          description: "Validation failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
        "500":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /v2/deployments/{id}:
    get:
      tags:
        - "Deployments"
      summary: "Get deployment"
      description: "Retrieve a deployment by ID or name."
      operationId: "get_deployment"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            description: "A resource path like 'sfc:capacity:acme:prod:my-pool' _or_ an ID. Resource paths are human-readable but not stable - they change when resources are renamed or moved. IDs are stable and permanent."
            examples:
              - "depl_k3R-nX9vLm7Qp2Yw5Jd8F"
            pattern: "(depl_[0-9a-zA-Z_-]{1,21})|(sfc:deployment:[a-zA-Z0-9._-]+(:[a-zA-Z0-9._-]+){1,2})"
        - name: "expand"
          in: "query"
          required: false
          schema:
            type: "array"
            items:
              type: "string"
              enum:
                - "capacity"
                - "node_template"
          style: "form"
          explode: true
      responses:
        "200":
          description: "Deployment details."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentResponse"
        "401":
          description: "Unauthorized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "404":
          description: "Deployment not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "500":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
    delete:
      tags:
        - "Deployments"
      summary: "Delete deployment"
      description: "Delete a deployment."
      operationId: "delete_deployment"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            description: "A resource path like 'sfc:capacity:acme:prod:my-pool' _or_ an ID. Resource paths are human-readable but not stable - they change when resources are renamed or moved. IDs are stable and permanent."
            examples:
              - "depl_k3R-nX9vLm7Qp2Yw5Jd8F"
            pattern: "(depl_[0-9a-zA-Z_-]{1,21})|(sfc:deployment:[a-zA-Z0-9._-]+(:[a-zA-Z0-9._-]+){1,2})"
      responses:
        "204":
          description: "Deployment deleted."
        "401":
          description: "Unauthorized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "403":
          description: "Forbidden."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: "Deployment not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "500":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
    patch:
      tags:
        - "Deployments"
      summary: "Update deployment"
      description: "Update a deployment's configuration."
      operationId: "patch_deployment"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
            description: "A resource path like 'sfc:capacity:acme:prod:my-pool' _or_ an ID. Resource paths are human-readable but not stable - they change when resources are renamed or moved. IDs are stable and permanent."
            examples:
              - "depl_k3R-nX9vLm7Qp2Yw5Jd8F"
            pattern: "(depl_[0-9a-zA-Z_-]{1,21})|(sfc:deployment:[a-zA-Z0-9._-]+(:[a-zA-Z0-9._-]+){1,2})"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchDeploymentRequest"
        required: true
      responses:
        "200":
          description: "Deployment updated."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentResponse"
        "400":
          description: "Deployment with this name already exists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        "401":
          description: "Unauthorized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "403":
          description: "Forbidden."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForbiddenError"
        "404":
          description: "Deployment not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "422":
          description: "Validation failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnprocessableEntityError"
        "500":
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /v2/images:
    get:
      tags:
        - "Images"
      summary: "List images"
      description: "List all images owned by the authenticated user."
      operationId: "list_images"
      parameters:
        - name: "workspace"
          in: "query"
          description: "Filter by workspace."
          required: true
          schema:
            $ref: "#/components/schemas/ResourcePathOrId_WorkspaceId"
        - name: "id"
          in: "query"
          description: "Filter by image ID (repeatable)."
          required: false
          schema:
            type: "array"
            items:
              $ref: "#/components/schemas/ImageId"
          style: "form"
          explode: true
        - name: "limit"
          in: "query"
          description: "Maximum number of results to return (1-200, default 50)."
          required: false
          schema:
            type: "integer"
            format: "u-int32"
            default: 50
            maximum: 200
            minimum: 1
        - name: "starting_after"
          in: "query"
          description: "Cursor for forward pagination (from a previous response's `cursor` field)."
          required: false
          schema:
            $ref: "#/components/schemas/ImagesCursor"
        - name: "ending_before"
          in: "query"
          description: "Cursor for backward pagination."
          required: false
          schema:
            $ref: "#/components/schemas/ImagesCursor"
      responses:
        "200":
          description: "Paginated list of images"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListImagesResponse"
        "400":
          description: "Bad request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        "401":
          description: "Unauthorized request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
      x-speakeasy-pagination:
        type: "cursor"
        inputs:
          - name: "starting_after"
            in: "parameters"
            type: "cursor"
        outputs:
          nextCursor: "$.cursor"
    post:
      tags:
        - "Images"
      summary: "Create image"
      description: "Create an image and start a multipart upload."
      operationId: "create_image"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartUploadRequest"
        required: true
      responses:
        "201":
          description: "Image created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageUploadResponse"
        "400":
          description: "Validation failed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequestError"
        "401":
          description: "Unauthorized request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "409":
          description: "Image already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
      x-speakeasy-name-override: "startUpload"
  /v2/images/{id}:
    get:
      tags:
        - "Images"
      summary: "Get image"
      description: "Retrieve an image by ID. Returns both user-owned and public images."
      operationId: "fetch_image"
      parameters:
        - name: "id"
          in: "path"
          description: "Image ID, name, or resource path"
          required: true
          schema:
            type: "string"
            description: "A resource path like 'sfc:capacity:acme:prod:my-pool' _or_ an ID. Resource paths are human-readable but not stable - they change when resources are renamed or moved. IDs are stable and permanent."
            examples:
              - "image_k3R-nX9vLm7Qp2Yw5Jd8F"
            pattern: "(image_[0-9a-zA-Z_-]{1,21})|(sfc:image:[a-zA-Z0-9._-]+(:[a-zA-Z0-9._-]+){1,2})"
      responses:
        "200":
          description: "Image details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageListEntry"
        "401":
          description: "Unauthorized request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "404":
          description: "Image not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
    delete:
      tags:
        - "Images"
      summary: "Delete image"
      description: "Delete an image."
      operationId: "delete_image"
      parameters:
        - name: "id"
          in: "path"
          description: "Image ID, name, or resource path"
          required: true
          schema:
            type: "string"
            description: "A resource path like 'sfc:capacity:acme:prod:my-pool' _or_ an ID. Resource paths are human-readable but not stable - they change when resources are renamed or moved. IDs are stable and permanent."
            examples:
              - "image_k3R-nX9vLm7Qp2Yw5Jd8F"
            pattern: "(image_[0-9a-zA-Z_-]{1,21})|(sfc:image:[a-zA-Z0-9._-]+(:[a-zA-Z0-9._-]+){1,2})"
      responses:
        "200":
          description: "Image deleted"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteImageResponse"
        "401":
          description: "Unauthorized request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
        "404":
          description: "Image not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotFoundError"
        "409":
          description: "Image is referenced by a node template"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictError"
        "500":
          description: "Internal server error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalServerError"
  /v2/images/{id}/complete:
    post:
      tags:
        - "Images"
      summary: "Complete image upload"
      description: "Finalize a multipart image upload."
      operationId: "complete_image_upload"
      parameters:
        - name: "id"
          in: "path"
          description: "Image ID, name, or resource path"
          required: true
