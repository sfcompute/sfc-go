overlay: 1.0.0
info:
  title: SFC API SDK Fixes
  version: 0.0.3
  # Workarounds for spec issues that block SDK generation. These regressed after sfcompute
  # PR #5421 ("clean up OpenAPI spec to eliminate SDK generation workarounds") when later
  # PRs (#5453, #5479) re-introduced the collisions. Remove each entry once the underlying
  # spec bug is fixed at the source in sfcompute.

actions:
  # /availability and /instance_skus are both tagged "Instance SKUs" and both reduce to a
  # generated List() method, colliding in the same namespace. Give each a distinct name.
  - target: "$.paths['/preview/v2/availability'].get"
    update:
      x-speakeasy-name-override: listAvailability
  - target: "$.paths['/preview/v2/instance_skus'].get"
    update:
      x-speakeasy-name-override: listInstanceSKUs

  # The top-level tags array defines "Orders" twice (base orders + order estimate), which
  # Speakeasy rejects as a duplicate tag. Remove the redundant estimate definition; the
  # order_estimate operation still references the remaining "Orders" tag. Targeted by the
  # estimate description so only the duplicate (not both) is removed.
  - target: "$.tags[?(@.name=='Orders' && @.description=='Estimate an order before placing it: filled price, fee, and operational notices.')]"
    remove: true

  # The "Orderbook" tag has two list-like GETs (fills, windows) and two get-like GETs
  # (depth, quote), so Speakeasy generates colliding List()/Get() methods. Give each a
  # distinct name.
  - target: "$.paths['/preview/v2/orderbook/depth'].get"
    update:
      x-speakeasy-name-override: getOrderbookDepth
  - target: "$.paths['/preview/v2/orderbook/fills'].get"
    update:
      x-speakeasy-name-override: listOrderbookFills
  - target: "$.paths['/preview/v2/orderbook/quote'].get"
    update:
      x-speakeasy-name-override: getOrderbookQuote
  - target: "$.paths['/preview/v2/orderbook/windows'].get"
    update:
      x-speakeasy-name-override: listOrderbookWindows
